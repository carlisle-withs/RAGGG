<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; height: 100%; display: flex; flex-direction: column; }

        /* Auth Section */
        .auth-section { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 60px auto; }
        .auth-section h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #4a90e2; }
        .btn { width: 100%; padding: 12px; background: #4a90e2; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #3a7bc8; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .auth-switch { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
        .auth-switch a { color: #4a90e2; cursor: pointer; text-decoration: underline; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; text-align: center; }

        /* Chat Layout */
        .chat-layout { display: none; flex: 1; flex-direction: column; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h1 { font-size: 18px; color: #333; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info span { font-size: 14px; color: #666; }
        .logout-btn { padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .logout-btn:hover { background: #f0f0f0; }

        /* Messages */
        .messages { flex: 1; overflow-y: auto; padding: 24px; }
        .welcome { text-align: center; padding: 60px 20px; }
        .welcome h2 { font-size: 24px; margin-bottom: 12px; color: #333; }
        .welcome p { color: #666; margin-bottom: 20px; }
        .quick-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .quick-btn { padding: 10px 20px; background: #fff; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .quick-btn:hover { background: #f0f0f0; }

        .message { display: flex; gap: 12px; margin-bottom: 20px; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .message.assistant .avatar { background: #4a90e2; color: #fff; }
        .message-content { max-width: 70%; }
        .message-text { padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; }
        .message.user .message-text { background: #4a90e2; color: #fff; }
        .message.assistant .message-text { background: #f0f0f0; color: #333; }
        .typing { display: flex; gap: 4px; padding: 12px 16px; }
        .typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typing 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

        /* Input Area */
        .input-area { padding: 16px 24px; border-top: 1px solid #e0e0e0; }
        .input-row { display: flex; gap: 12px; }
        .message-input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 14px; font-family: inherit; max-height: 120px; }
        .message-input:focus { outline: none; border-color: #4a90e2; }
        .send-btn { width: 60px; background: #4a90e2; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .input-hint { margin-top: 8px; font-size: 12px; color: #888; }
        .input-hint span { margin-right: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Form -->
        <div id="authSection" class="auth-section">
            <h2 id="authTitle">登录</h2>
            <form id="authForm">
                <div class="form-group" id="usernameGroup" style="display:none;">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="输入用户名">
                </div>
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="account" placeholder="输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn" id="authBtn">登录</button>
            </form>
            <div class="error-msg" id="authError"></div>
            <div class="auth-switch">
                <span id="switchText">没有账号？<a onclick="toggleAuth()">注册</a></span>
            </div>
        </div>

        <!-- Chat Interface -->
        <div id="chatLayout" class="chat-layout">
            <div class="chat-header">
                <h1>RAG 智能问答</h1>
                <div class="user-info">
                    <span id="userDisplay"></span>
                    <button class="logout-btn" onclick="logout()">退出</button>
                </div>
            </div>
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <h2>你好，我是 RAG 助手</h2>
                    <p>输入问题即可开始对话，也可以使用 /search 开头进行文档检索</p>
                    <div class="quick-btns">
                        <button class="quick-btn" onclick="sendQuick('请介绍一下这个系统的能力')">系统能力</button>
                        <button class="quick-btn" onclick="sendQuick('/search RAG 文档处理链路')">文档检索</button>
                        <button class="quick-btn" onclick="sendQuick('结合上一个问题继续展开说明')">多轮追问</button>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-row">
                    <textarea class="message-input" id="messageInput" placeholder="输入消息，/search 开头进行检索..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
                <div class="input-hint">
                    <span>Enter 发送</span>
                    <span>Shift + Enter 换行</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:18081/api/v1';
        let token = localStorage.getItem('token');
        let user = JSON.parse(localStorage.getItem('user') || 'null');
        let conversationId = null;
        let isLogin = true;
        let loading = false;

        // Check auth status on load
        if (token) {
            showChat();
        }

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('authTitle').textContent = isLogin ? '登录' : '注册';
            document.getElementById('authBtn').textContent = isLogin ? '登录' : '注册';
            document.getElementById('switchText').innerHTML = isLogin
                ? '没有账号？<a onclick="toggleAuth()">注册</a>'
                : '已有账号？<a onclick="toggleAuth()">登录</a>';
            document.getElementById('usernameGroup').style.display = isLogin ? 'none' : 'block';
            document.getElementById('authError').textContent = '';
        }

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('authError');
            errorEl.textContent = '';

            const endpoint = isLogin ? '/auth/login' : '/auth/register';
            const body = isLogin
                ? { username: account, password }
                : { username: account, password, email: account.includes('@') ? account : '' };

            try {
                const res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.message || data.error || '请求失败';
                    return;
                }

                token = data.token;
                user = data.user;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));
                showChat();
            } catch (err) {
                errorEl.textContent = '网络错误: ' + err.message;
            }
        };

        function showChat() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('chatLayout').style.display = 'flex';
            document.getElementById('userDisplay').textContent = user?.username || '';
        }

        function logout() {
            token = null;
            user = null;
            conversationId = null;
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('chatLayout').style.display = 'none';
            document.getElementById('messages').innerHTML = document.getElementById('welcome').outerHTML;
            document.getElementById('account').value = '';
            document.getElementById('password').value = '';
        }

        function sendQuick(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || loading) return;

            const isSearch = text.startsWith('/search ');
            const query = isSearch ? text.slice(8) : text;

            input.value = '';
            loading = true;
            document.getElementById('sendBtn').disabled = true;

            // Hide welcome
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage('user', isSearch ? text : query);

            // Add assistant placeholder
            const assistantDiv = addMessage('assistant', '');

            if (isSearch) {
                // Search mode
                try {
                    const res = await fetch(API_BASE + '/retrieve', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({ query })
                    });
                    const data = await res.json();
                    if (data.results && data.results.length > 0) {
                        assistantDiv.textContent = data.results.map(r =>
                            `📄 ${r.content.substring(0, 200)}...\n相似度: ${(r.score * 100).toFixed(1)}%`
                        ).join('\n\n');
                    } else {
                        assistantDiv.textContent = '没有找到相关内容';
                    }
                } catch (err) {
                    assistantDiv.textContent = '检索失败: ' + err.message;
                }
            } else {
                // Chat mode
                conversationId = conversationId || crypto.randomUUID();
                try {
                    const res = await fetch(API_BASE + '/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({ message: query, conversationId })
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        assistantDiv.textContent = '请求失败: ' + res.status + ' - ' + errText;
                        return;
                    }

                    const data = await res.json();
                    assistantDiv.textContent = data.message || '';
                    scrollToBottom();
                } catch (err) {
                    assistantDiv.textContent = '发送失败: ' + err.message;
                }
            }

            loading = false;
            document.getElementById('sendBtn').disabled = false;
            scrollToBottom();
        }

        function addMessage(role, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
            `;
            messages.appendChild(div);
            return div.querySelector('.message-text');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }

        // Handle Enter key
        document.getElementById('messageInput').onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        // Auto-resize textarea
        document.getElementById('messageInput').oninput = function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        };
    </script>
</body>
</html>
