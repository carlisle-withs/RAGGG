spring:
  application:
    name: RAGDemo
  config:
    import: optional:file:./config.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      database: ${redis.database:0}
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      resolve-lazily: false
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers:localhost:29292}
    consumer:
      group-id: ${kafka.consumer.group-id:rag-system}
      max-poll-records: 1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 1800000
    listener:
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:rag_system}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${app.port:8081}
  address: ${app.host:0.0.0.0}
  tomcat:
    max-swallow-size: 2GB
    max-http-form-post-size: 2GB

# Custom config
milvus:
  uri: ${milvus.uri:http://localhost:29530}
  collection: ${milvus.collection:rag_chunks}

elasticsearch:
  host: ${elasticsearch.host:localhost}
  port: ${elasticsearch.port:29201}
  index: ${elasticsearch.index:rag_documents}

llm:
  provider: ${llm.provider:minimax}
  api-key: ${llm.api-key:}
  model: ${llm.model:MiniMax-Text-01}
  base-url: ${llm.base-url:https://api.minimax.chat/v1}
  group-id: ""

embedding:
  provider: siliconflow                           # ollama | siliconflow
  model: BAAI/bge-m3                             # SiliconFlow 云端模型
  dimension: 1024                                # bge-m3 为 1024 维
  base-url: https://api.siliconflow.cn/v1         # SiliconFlow API 地址
  api-key: ${embedding.api-key:}                  # SiliconFlow API Key
  batch-size: 8

# ===== P1: Reranker 配置 =====
reranker:
  model: ${reranker.model:BAAI/bge-reranker-v2-m3}
  base-url: ${reranker.base-url:https://api.siliconflow.cn/v1}
  api-key: ${reranker.api-key:}
  enabled: ${reranker.enabled:true}

# ===== P1: 检索策略配置 =====
retrieval:
  strategy: ${retrieval.strategy:hybrid}      # hybrid / hierarchical
  rerank:
    enabled: ${rerank.enabled:true}
    provider: ${rerank.provider:siliconflow}
  final-topk: 5
  swa:
    merging-ratio: ${retrieval.swa.merging-ratio:0.5}  # Auto-Merging 合并阈值
    window-size: ${retrieval.swa.window-size:3}        # Sentence Window 大小

memory:
  window-size: ${MEMORY_WINDOW_SIZE:10}          # Redis 窗口失效后从 MySQL 回源重建的条数
  summary-threshold: ${MEMORY_SUMMARY_THRESHOLD:8} # 条数触发阈值（辅助）
  trigger-tokens: ${MEMORY_TRIGGER_TOKENS:2500}    # 窗口估算 token 触发阈值（主，单条长消息不受条数保护）
  context-max-tokens: ${MEMORY_CONTEXT_MAX_TOKENS:3000} # 记忆上下文总预算（摘要+最近消息）
  ttl-days: ${MEMORY_TTL_DAYS:7}

chunking:
  chunk-size: ${chunking.chunk-size:512}
  chunk-overlap: ${chunking.chunk-overlap:50}

kafka-topics:
  document-raw: ${kafka.topics.document-raw:document-raw}
  document-chunked: ${kafka.topics.document-chunked:document-chunked}
  document-indexed: ${kafka.topics.document-indexed:document-indexed}

minio:
  endpoint: ${minio.endpoint:http://localhost:29005}
  access-key: ${minio.access-key:minioadmin}
  secret-key: ${minio.secret-key:minioadmin}
  bucket: ${minio.bucket:rag-documents}

# ===== P1: OpenTelemetry 可观测性配置 =====
otel:
  enabled: false
  service:
    name: raggg
    version: 1.0.0
  exporter:
    endpoint: http://localhost:4317
  metrics:
    interval-seconds: 30
  resource:
    env: dev
  sampling:
    ratio: 1.0

logging:
  level:
    root: INFO
    com.rag: DEBUG
    com.rag.infrastructure.observability: INFO
    com.rag.infrastructure.llm.SiliconFlowReranker: INFO
    com.rag.application.retrieval.HierarchicalRetrievalService: INFO

# ===== Actuator + Prometheus Metrics =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[*]": true
      percentiles:
        "[*]": [0.5, 0.95, 0.99]

# ===== Knife4j Swagger UI 配置 =====
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: RAGGG API 文档
    description: RAG 智能问答系统完整接口
    version: 1.0.0
    contact:
      name: RAGGG Team
      email: support@raggg.com
