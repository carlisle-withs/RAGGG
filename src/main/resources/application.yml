spring:
  application:
    name: RAGDemo
  config:
    import: optional:file:./config.yaml
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      database: ${redis.database:0}
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    consumer:
      group-id: ${kafka.consumer.group-id:rag-system}
      max-poll-records: 1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 1800000
    listener:
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/${mysql.database:rag_system}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${mysql.username:root}
    password: ${mysql.password:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${app.port:8080}
  address: ${app.host:0.0.0.0}

# Custom config
milvus:
  uri: ${milvus.uri:http://localhost:19530}
  collection: ${milvus.collection:rag_chunks}

elasticsearch:
  host: ${elasticsearch.host:localhost}
  port: ${elasticsearch.port:9200}
  index: ${elasticsearch.index:rag_documents}

llm:
  provider: ${llm.provider:minimax}
  api-key: ${llm.api-key:}
  model: ${llm.model:MiniMax-Text-01}
  base-url: ${llm.base-url:https://api.minimax.chat/v1}
  group-id: ""

embedding:
  model: ${embedding.model:BAAI/bge-m3}
  dimension: ${embedding.dimension:1024}

# ===== P1: Reranker 配置 =====
reranker:
  model: BAAI/bge-reranker-v2-m3
  enabled: true
  provider: siliconflow   # siliconflow / cohere / bi_encoder
  siliconflow:
    enabled: false
    api-key: ""
    model: BAAI/bge-reranker-v2-m3
    base-url: https://api.siliconflow.cn/v1
  cohere:
    api-key: ""
    model: rerank-multilingual-v3.0

# ===== P1: 检索策略配置 =====
retrieval:
  strategy: ${retrieval.strategy:hybrid}      # hybrid / hierarchical
  rerank:
    enabled: ${retrieval.rerank.enabled:true}
    provider: ${retrieval.rerank.provider:siliconflow}
  initial-topk: ${retrieval.initial-topk:20}   # RRF 融合后候选数
  final-topk: ${retrieval.final-topk:5}       # 精排后返还数
  swa:
    merging-ratio: ${retrieval.swa.merging-ratio:0.5}  # 合并阈值
    window-size: ${retrieval.swa.window-size:3}        # Sentence Window 大小

memory:
  window-size: ${memory.window-size:10}
  summary-threshold: ${memory.summary-threshold:8}
  ttl-days: ${memory.ttl-days:7}

chunking:
  chunk-size: ${chunking.chunk-size:512}
  chunk-overlap: ${chunking.chunk-overlap:50}

kafka-topics:
  document-raw: ${kafka.topics.document-raw:document-raw}
  document-chunked: ${kafka.topics.document-chunked:document-chunked}
  document-indexed: ${kafka.topics.document-indexed:document-indexed}

minio:
  endpoint: ${minio.endpoint:http://localhost:29005}
  access-key: ${minio.access-key:minioadmin}
  secret-key: ${minio.secret-key:minioadmin}
  bucket: ${minio.bucket:rag-documents}

# ===== P1: OpenTelemetry 可观测性配置 =====
otel:
  enabled: false
  service:
    name: raggg
    version: 1.0.0
  exporter:
    endpoint: http://localhost:4317
  metrics:
    interval-seconds: 30
  resource:
    env: dev
  sampling:
    ratio: 1.0

# Prometheus metrics endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: raggg

logging:
  level:
    root: INFO
    com.rag: DEBUG
    com.rag.infrastructure.observability: INFO
    com.rag.infrastructure.llm.SiliconFlowReranker: INFO
    com.rag.application.retrieval.HierarchicalRetrievalService: INFO
